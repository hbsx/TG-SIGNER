name: Build Docker packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native Docker image
        run: docker build -t tg-signer-dashboard:local .
      - name: Create and verify installation package
        run: |
          bash scripts/package.sh
          cd release
          sha256sum -c "tg-signer-dashboard-vps-${{ matrix.arch }}.tar.gz.sha256"
          sha256sum -c "tg-signer-dashboard-${{ matrix.arch }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.arch }}
          compression-level: 0
          path: |
            release/tg-signer-dashboard-${{ matrix.arch }}.tar.gz
            release/tg-signer-dashboard-${{ matrix.arch }}.tar.gz.sha256
            release/tg-signer-dashboard-vps-${{ matrix.arch }}.tar.gz
            release/tg-signer-dashboard-vps-${{ matrix.arch }}.tar.gz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: dist
      - name: Publish both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
